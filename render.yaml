services:
  - type: web
    name: excellm
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: OLLAMA_HOST
        value: http://localhost:11434
    autoDeploy: true
    plan: free
    resources:
      cpu: 2
      memory: 4GB
      disk: 10GB
