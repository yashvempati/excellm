<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excel Chatbot</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Excel LLM Chat</h1>

        <form id="uploadForm">
            <div class="form-group">
                <input type="file" id="fileInput" accept=".xlsx" />
                <button type="submit" class="primary-button">Upload Excel</button>
            </div>
        </form>

        <div id="chatBox"></div>

        <form id="askForm">
            <div class="form-group">
                <input type="text" id="questionInput" placeholder="Ask a question..." required />
                <button type="submit" class="primary-button">Ask</button>
            </div>
        </form>

        <div class="button-group">
            <button id="clearButton" class="secondary-button">Clear Chat</button>
            <button id="exportButton" class="secondary-button">Export Chat</button>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
