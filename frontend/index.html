<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Excel Chatbot</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <h1>Excel LLM Chat</h1>

        <form id="uploadForm">
            <input type="file" id="fileInput" accept=".xlsx" />
            <button type="submit">Upload Excel</button>
        </form>

        <div id="chatBox"></div>

        <form id="askForm">
            <input type="text" id="questionInput" placeholder="Ask a question..." required />
            <button type="submit">Ask</button>
        </form>

        <div class="buttons">
            <button id="clearButton">Clear Chat</button>
            <button id="exportButton">Export Chat</button>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
